	<style type="text/css">:root { 
            --bg-color: #0f172a; --card-bg: #1e293b;       
            --accent-gold: #ffb100; --text-main: #f8fafc;     
            --text-dim: #94a3b8; --success: #25d366;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: var(--bg-color); color: var(--text-main); 
            margin: 0; padding: 10px; direction: rtl; 
            overflow-x: hidden; -webkit-font-smoothing: antialiased;
            /* مساحة مرنة في الأسفل لتناسب حجم الإعلان */
            padding-bottom: 120px; 
        }

        .container { width: 100%; max-width: 480px; margin: 0 auto; box-sizing: border-box; }

        .main-nav { display: flex; gap: 8px; margin: 10px 0 20px 0; }
        .main-tab { 
            flex: 1; padding: 12px 5px; text-align: center; 
            background: var(--card-bg); border-radius: 12px;
            cursor: pointer; font-weight: bold; font-size: 14px;
            transition: 0.3s; border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-dim);
        }
        .main-tab.active-section { 
            border-color: var(--accent-gold); color: var(--accent-gold); 
            background: rgba(255, 177, 0, 0.08); 
        }

        .brands-grid { 
            display: grid; grid-template-columns: repeat(3, 1fr); 
            gap: 6px; margin-bottom: 20px; 
        }
        .brand-btn { 
            background: rgba(30, 41, 59, 0.5); border: 1px solid rgba(255, 255, 255, 0.05); 
            color: var(--text-dim); padding: 10px 2px; border-radius: 10px; 
            font-size: 11px; font-weight: 600; min-height: 40px;
            display: flex; align-items: center; justify-content: center;
        }
        .brand-btn.active { 
            background: var(--accent-gold); color: #0f172a; 
            box-shadow: 0 4px 12px rgba(255, 177, 0, 0.2);
        }

        .search-box { 
            width: 100%; padding: 14px; border-radius: 12px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            background: rgba(15, 23, 42, 0.8); color: var(--accent-gold); 
            font-size: 15px; text-align: center; outline: none; 
            margin-bottom: 20px; box-sizing: border-box;
            transition: 0.3s;
        }
        .search-box:focus { border-color: var(--accent-gold); background: #1e293b; }

        .card { 
            background: var(--card-bg); border-radius: 18px; padding: 15px; 
            margin-bottom: 12px; border-right: 4px solid var(--accent-gold);
            cursor: pointer; position: relative; transition: 0.2s;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        .card:active { transform: scale(0.98); opacity: 0.9; }

        .card::before {
            content: "📋 نقرة للنسخ"; position: absolute; top: 8px; left: 12px;
            font-size: 9px; color: var(--accent-gold); opacity: 0.5;
        }

        .d-list { 
            display: flex; flex-wrap: wrap; gap: 6px; 
            justify-content: center; margin-top: 10px; 
        }
        .tag { 
            background: rgba(15, 23, 42, 0.4); padding: 6px 10px; 
            border-radius: 8px; font-size: 12px; 
            border: 1px solid rgba(255, 255, 255, 0.05); color: #ccc;
        }
        .tag.match { background: var(--accent-gold); color: #0f172a; font-weight: bold; }

        /* --- تعديل الإعلان ليفهم الحجم تلقائياً --- */
        #smart-ad-box {
            position: fixed; bottom: 0; left: 0; width: 100%; 
            max-height: 120px; /* أقصى ارتفاع مسموح */
            z-index: 10000; display: none; background: #0f172a;
            border-top: 2px solid var(--accent-gold); cursor: pointer;
            text-align: center;
        }
        #smart-ad-img { 
            max-width: 100%; 
            max-height: 110px; 
            height: auto; /* يجعل الارتفاع يتناسب مع عرض الصورة */
            object-fit: contain; /* يضمن ظهور الصورة كاملة بدون قص */
            display: block;
            margin: 0 auto;
        }

        #copy-toast {
            position: fixed; bottom: 130px; left: 50%; transform: translateX(-50%);
            background: var(--success); color: white; padding: 8px 20px;
            border-radius: 50px; font-size: 13px; font-weight: bold; 
            z-index: 30000; display: none; box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

<script>
    const VERSION_CURRENT = 2; // رقم إصدار برنامجك الحالي
    const UPD_URL = "https://firassaldalate.github.io/Black-List/config.json";
    const AD_URL = "https://firassaldalate.github.io/Black-List/fullscreenad.json";

    async function startSystem() {
        if (!navigator.onLine) return;

        try {
            // 1. فحص التحديث أولاً
            const resUpd = await fetch(UPD_URL + "?v=" + Date.now());
            if (resUpd.ok) {
                const dataUpd = await resUpd.json();
                if (dataUpd.latest_version > VERSION_CURRENT) {
                    showUpdUI(dataUpd.update_notes || "يتوفر إصدار جديد مع تحسينات عامة.");
                    return; 
                }
            }

            // 2. إذا لم يوجد تحديث، افحص الإعلان
            const resAd = await fetch(AD_URL + "?v=" + Date.now());
            if (resAd.ok) {
                const dataAd = await resAd.json();
                if (dataAd && dataAd.show_ad === true) {
                    showAdUI(dataAd.ad_text, dataAd.contact_number);
                }
            }
        } catch (e) { console.log("System Check Error"); }
    }

    function showUpdUI(notes) {
        document.getElementById('inf-upd-notes').innerText = notes;
        document.getElementById('inf-upd-overlay').style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

    function showAdUI(txt, ph) {
        document.getElementById('inf-ad-txt').innerText = txt;
        document.getElementById('inf-ad-ph').innerText = ph || "";
        document.getElementById('inf-ad-overlay').style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

    function hideInfAd() {
        document.getElementById('inf-ad-overlay').style.display = 'none';
        document.body.style.overflow = 'auto';
    }

    function copyInfPh() {
        const ph = document.getElementById('inf-ad-ph').innerText;
        const btn = document.getElementById('inf-cp-btn');
        const temp = document.createElement('textarea');
        temp.value = ph; document.body.appendChild(temp);
        temp.select(); document.execCommand('copy');
        document.body.removeChild(temp);
        btn.innerText = "تم ✅"; setTimeout(() => btn.innerText = "نسخ", 2000);
    }

    window.addEventListener('DOMContentLoaded', startSystem);
</script>

<script>
    let currentAdNumber = ""; 

    function copyToClipboard(text) {
        if (!text) return;
        const el = document.createElement('textarea');
        el.value = text;
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);
        
        const toast = document.getElementById('copy-toast');
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 2000);
    }

    document.addEventListener('click', function (e) {
        const card = e.target.closest('.card');
        if (card) {
            const textToCopy = card.innerText.replace("📋 نقرة للنسخ", "").trim();
            copyToClipboard(textToCopy);
            return;
        }

        const adBox = e.target.closest('#smart-ad-box');
        if (adBox && currentAdNumber !== "") {
            copyToClipboard(currentAdNumber);
        }
    });

    async function loadAd() {
        try {
            const res = await fetch("https://firassaldalate.github.io/Black-List/ad.json", {cache: "no-store"});
            const data = await res.json();
            if (data.active) {
                currentAdNumber = data.link_url;
                document.getElementById('smart-ad-box').style.display = "block";
                document.getElementById('smart-ad-content').innerHTML = `<img id="smart-ad-img" src="${data.image_url}">`;
            }
        } catch (e) { console.log("Ad Error"); }
    }
    window.onload = loadAd;
</script>

// ---------------------------------------------------------

let currentMode = 'batteries'; 
let currentBrand = "Samsung";  

function setMode(mode) {
    currentMode = mode;
    document.getElementById('btn-bat').classList.toggle('active-section', mode === 'batteries');
    document.getElementById('btn-scr').classList.toggle('active-section', mode === 'screens');
    currentBrand = Object.keys(data[currentMode])[0];
    setupBrands();
    render();
}

function setupBrands() {
    const container = document.getElementById('brandContainer');
    container.innerHTML = Object.keys(data[currentMode]).map(brand => 
        `<div class="brand-btn ${brand === currentBrand ? 'active' : ''}" onclick="changeBrand('${brand}', this)">${brand}</div>`
    ).join('');
}

function changeBrand(brand, el) {
    currentBrand = brand;
    document.querySelectorAll('.brand-btn').forEach(btn => btn.classList.remove('active'));
    el.classList.add('active');
    render();
}

function render() {
    const query = document.getElementById('searchInput').value.toLowerCase().trim();
    const resultsDiv = document.getElementById('results');
    
    if (query === "") { resultsDiv.innerHTML = ""; return; }
    resultsDiv.innerHTML = "";
    let found = false;

    data[currentMode][currentBrand].forEach(item => {
        const isMatch = item.devices.some(d => d.toLowerCase().includes(query));
        if (isMatch) {
            found = true;
            let devicesHtml = item.devices.map(d => {
                const highlight = d.toLowerCase().includes(query) ? 'match' : '';
                return `<span class="tag ${highlight}">${d}</span>`;
            }).join('');
            resultsDiv.innerHTML += `<div class="card"><div class="d-list">${devicesHtml}</div></div>`;
        }
    });

    if (!found) resultsDiv.innerHTML = `<p style="text-align:center; color:#666;">لا توجد نتائج في هذا القسم</p>`;
}

setupBrands();
